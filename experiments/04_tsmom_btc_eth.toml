# Experiment 04: time-series momentum (Moskowitz, Ooi & Pedersen 2012) on BTC and ETH.
# Long while the coin's own return over the lookback is positive, flat otherwise; walk-forward picks
# the lookback. The simplest trend rule there is, and the baseline the Donchian ensemble must beat.
# Run:  tiq run experiments/04_tsmom_btc_eth.toml

[experiment]
name = "04_tsmom_btc_eth"
family = "crypto-trend"
hypothesis = """
The sign of BTC's and ETH's own past return over one to twelve months predicts the next period's \
return (time-series momentum; Liu & Tsyvinski 2021 find it at one- to eight-week horizons), so a \
long/flat rule beats holding both coins on a risk-adjusted basis after costs.
"""

[data]
interval = "1d"
start = "2018-09-01"

[universe]
symbols = ["BTCUSDT", "ETHUSDT"]

[strategy]
name = "tsmom"

[strategy.params]
target_vol = 0.25
vol_lookback_days = 90

[strategy.grid]
lookback_days = [14, 30, 60, 90, 180, 365]

[execution]
delay = 1
rebalance_band = 0.02

[costs]
fee_bps = 10.0
half_spread_bps = 5.0
impact_coef = 1.0
capital = 100000.0

[validation]
mode = "walk_forward"
train_days = 730
test_days = 182
min_trades = 2

[kill_criteria]
min_oos_sharpe = 0.5
min_psr = 0.95
min_dsr = 0.95
max_pbo = 0.5
max_spa_pvalue = 0.10
max_null_pvalue = 0.10
min_breakeven_cost_multiple = 2.0
max_drawdown = 0.5
must_beat = ["buy_and_hold", "vol_target_buy_and_hold"]
