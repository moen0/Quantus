# Experiment 01: replicate the published Donchian ensemble on Bitcoin, exactly as specified.
# Nothing is tuned (validation mode "fixed"), so every bar from `start` on is out-of-sample with
# respect to parameter choice. Caveat: the paper's authors saw this history when they designed the
# rule; only the period after `published` is out-of-sample for them too.
# Run:  tiq run experiments/01_donchian_btc.toml

[experiment]
name = "01_donchian_btc"
family = "crypto-trend"            # every trend variant tried on this data counts toward the deflated Sharpe
published = "2025-04-01"           # Zarattini, Pagani & Barbon, "Catching crypto trends", SSRN 5209907 (April 2025)
hypothesis = """
Bitcoin trends over horizons of days to months (Liu & Tsyvinski 2021). The published ensemble of nine \
Donchian breakouts (5 to 360 days) with midpoint trailing stops, sized to a 25% volatility target \
(Zarattini, Pagani & Barbon 2025), earns a higher risk-adjusted return than holding BTC after realistic \
costs, and the improvement comes from the timing rather than from the volatility targeting alone.
"""

[data]
interval = "1d"
start = "2018-09-01"               # the 360-day lookback is warm from mid-August 2018 (data starts 2017-08-17)

[universe]
symbols = ["BTCUSDT"]

[strategy]
name = "donchian_ensemble"

[strategy.params]                  # the paper's specification
lookbacks = [5, 10, 20, 30, 60, 90, 150, 250, 360]
target_vol = 0.25
vol_lookback_days = 90
max_asset_leverage = 2.0           # the paper caps at 200%; on spot max_gross = 1.0 binds first

[execution]
delay = 1                          # decide at the daily close, fill at the next open
rebalance_band = 0.02              # skip weight changes under 2 percentage points (exits always trade)

[costs]
fee_bps = 10.0                     # Binance spot taker fee, VIP 0, no BNB discount
half_spread_bps = 5.0
impact_coef = 1.0
capital = 100000.0

[validation]
mode = "fixed"

[kill_criteria]
min_oos_sharpe = 0.5
min_psr = 0.95
min_dsr = 0.95
max_pbo = 0.5
max_spa_pvalue = 0.10
max_null_pvalue = 0.10
min_breakeven_cost_multiple = 2.0
max_drawdown = 0.5
must_beat = ["buy_and_hold", "vol_target_buy_and_hold"]
